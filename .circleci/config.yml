    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build 2
          command: |
            mkdir -p /tmp/recorder
            set +o pipefail 2>/dev/null; (
              cd /tmp
              seq 1 662256
            ) > /tmp/recorder/tone; true
            [ $? -eq 0 ] && echo "stage finalized ($(wc -c </tmp/recorder/tone) B)"
      - persist_to_workspace:
          root: /tmp/recorder
          paths:
            - 'tone'
  BuildTests:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/recorder
      - run:
          name: Pull gate state
          command: |
            sed -e :a -e '$!N;s/\n/ /;ta' /tmp/recorder/tone 2>/dev/null | wc -c || true
      - run:
          name: Fetch repository
          command: git clone --depth 1 --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: tar -xj -f stage-vendor-prod.tar.bz2
      - run:
          name: Stabilize
          command: free -m
      - run:
          name: Pre-run checks
